# simclr_config.yaml
# ==============================
# SimCLR + PH Configuration
# ==============================

data_dir: ./data

# dataset: cifar10 | cifar100 | stl10  (stl10 = 96x96, SSL on the unlabeled split)
dataset: cifar10

# device: auto | cuda | mps | cpu  (auto picks cuda>mps>cpu)
device: auto

# backbone: resnet18 | resnet34 | resnet50
backbone: resnet18

batch_size: 128
workers: 2
epochs: 10
log_interval: 5

learning_rate: 0.3
momentum: 0.9
weight_decay: 1e-6
temperature: 0.5

projection_dim: 64
seed: 0


# Choose: baseline | phsim | hybrid
method: baseline

# ==============================
# Training control
# ==============================

train:
  max_steps: 200        # set -1 for full epoch
  warmup_epochs: 0     # baseline warmup even if method=phsim/hybrid
  resume: true          # auto-resume from the latest checkpoint for this (method,seed)
                        # if present (crash / spot-preemption safe). set false to force restart.
  grad_clip: 5.0        # clip grad-norm (0 disables). guards PH/topology gradient spikes
                        # (esp. STL-64's larger point clouds) from NaN-ing the run.
  nan_skip_limit: 50    # abort if more than this many non-finite-loss batches are skipped

optim:
  lr_min: 1e-3

aug:
  color_strength: 0.5

data:
  subset_size: 10000    # set -1 for full CIFAR

model:
  proj_hidden_dim: 512

# ==============================
# PH configuration
# ==============================

ph:
  reduce_channels: 8
  # PH point-cloud source layer: layer3 -> 4x4=16 pts (default), layer2 -> 8x8=64 pts
  # (richer, supports H1). layer4 is the old 2x2=4-pt behavior (too coarse).
  source_layer: layer3
  # extra_layers: enable MULTISCALE PH by adding more depths, e.g. [layer2]
  # (loss is averaged over source_layer + extra_layers). Empty = single scale.
  extra_layers: []
  num_points: 64
  margin: 1.0
  n_directions: 32
  ph_lambda: 1.0
  neg_agg: hard          # hard (min) | soft (smooth-min over all negatives)
  softmin_temp: 0.1
  pi_grid: 12
  pi_sigma: 0.15
  birth_min: 0.0
  birth_max: 4.0
  pers_min: 0.0
  pers_max: 4.0
  max_pts_per_dgm: 64
  wasserstein_p: 1
  neg_k: 2              # try 1 / 2 / 4
  wasserstein_tau: 1.0  # scale for distance->teacher logits
  w_h0: 0.2
  w_h1: 1.0
# ==============================
# Adversarial training (PH-ACL) configuration
# ==============================
# Used by adversarial methods: adv_baseline (=ACL), adv_phsim, adv_swcontrol,
# topoacl (flagship: NT-Xent + beta * topological adversarial consistency),
# rawacl (non-topological consistency control).
adv:
  eps: 0.031372549     # 8/255 Linf inner-maximization budget
  alpha: -1.0          # step size; -1 => 2.5*eps/steps
  steps: 5             # inner PGD steps (cost ~ steps x; 3-7 typical)
  beta: 1.0            # weight on the adversarial-consistency term (topoacl/rawacl)
  random_start: true
  ramp_epochs: 0       # curriculum: linearly ramp eps & beta from ~0 over this many
                       # epochs (0 = no ramp). Stabilizes adversarial-from-scratch.
  teacher: none        # none | ema : EMA-teacher topological self-distillation
                       # (topoacl/rawacl match a momentum teacher's clean diagram)
  ema_momentum: 0.996
  dual_bn: false       # AdvProp/AdvCL: route clean->clean-BN, adv->adv-BN (separate
                       # BatchNorm branches; shared conv weights). Only affects
                       # adversarial methods. Eval/inference uses the clean branch.
                       # For adv_* methods the loss becomes clean_loss + adv_loss.

# ==============================
# Loss configuration
# ==============================

loss:
  # for hybrid (baseline + phsim)
  alpha: 0.9

  # for phsim / hybrid
  teacher_temperature: 0.3   # PH soft-target temperature
  student_temperature: 0.5   # rep similarity temperature

  ph_topk: 10                # top-k neighbors for PH targets (0 disables)
  ph_proj_align: 0.05        # similarity alignment weight (0 disables)

# ==============================
# Linear evaluation
# ==============================

finetune_epochs: 10
load_epoch: 10

eval:
  gamma_per_class: 50
  gamma_batch_size: 256

attack:
  enabled: true
  eps: 0.031372549  # 8/255
  fgsm: true
  pgd: true
  pgd_steps: 10
  pgd_alpha: 0.007843137  # 2/255
  pgd_random_start: true
  max_test_batches: -1